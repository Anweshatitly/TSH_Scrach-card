<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — The Stationery Hub</title>
  <link rel="icon" href="logo.jpg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    :root {
      --navy: #1B2A4A;
      --gold: #B8A04A;
      --cream: #F5F0E1;
      --teal: #4A9E8E;
      --light-gold: #D4C878;
      --red: #E74C3C;
      --green: #27AE60;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #F0EBE0, #E8E0CC);
      min-height: 100vh;
      color: var(--navy);
    }

    .header {
      background: var(--navy);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .header img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--gold);
    }

    .header h1 {
      color: var(--cream);
      font-size: 20px;
      font-weight: 700;
    }

    .header span {
      color: var(--gold);
      font-size: 12px;
      font-weight: 500;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px 20px;
    }

    /* ===== ADD CUSTOMER FORM ===== */
    .form-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 2px solid var(--gold);
      margin-bottom: 25px;
    }

    .form-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #E0D9C8;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--navy);
      transition: border-color 0.3s;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--gold);
    }

    .tier-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    .tier-bronze { background: #F0E6C8; color: #8B6914; }
    .tier-silver { background: #E0E8F0; color: #4A6080; }
    .tier-gold { background: #FFF3CD; color: #856404; }
    .tier-none { background: #FFE0E0; color: #C0392B; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--teal), #3A8E7E);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(74, 158, 142, 0.3);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(74, 158, 142, 0.4);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ===== LINK RESULT ===== */
    .link-result {
      display: none;
      background: #E8F8F0;
      border: 2px solid var(--green);
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
    }

    .link-result h3 {
      color: var(--green);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .link-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .link-box input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--green);
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      color: var(--navy);
      background: white;
      outline: none;
    }

    .copy-btn {
      padding: 10px 20px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .copy-btn:hover { background: #219A52; }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .whatsapp-btn:hover { background: #1DA851; }

    /* ===== CUSTOMERS TABLE ===== */
    .table-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      overflow-x: auto;
    }

    .table-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      background: var(--cream);
      padding: 12px 20px;
      border-radius: 10px;
      text-align: center;
      min-width: 100px;
    }

    .stat-box .number {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
    }

    .stat-box .label {
      font-size: 10px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--navy);
      color: var(--cream);
      padding: 12px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    thead th:first-child { border-radius: 8px 0 0 0; }
    thead th:last-child { border-radius: 0 8px 0 0; }

    tbody td {
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid #f0ebe0;
      font-weight: 500;
    }

    tbody tr:hover { background: #FDFBF5; }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .status-revealed { background: #D5F5E3; color: #1E8449; }
    .status-pending { background: #FFF3CD; color: #856404; }

    .delete-btn {
      padding: 6px 14px;
      background: none;
      color: var(--red);
      border: 1.5px solid var(--red);
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .delete-btn:hover {
      background: var(--red);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="logo.jpg" alt="Logo">
    <div>
      <h1>The Stationery Hub</h1>
      <span>Admin Panel — Scratch Card Manager</span>
    </div>
  </div>

  <div class="container">
    <!-- Add Customer Form -->
    <div class="form-card">
      <h2>🎫 Create Scratch Card</h2>
      <form id="customerForm" onsubmit="addCustomer(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="custName" placeholder="e.g. Rahul Sharma" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="custPhone" placeholder="e.g. 9876543210" required>
          </div>
          <div class="form-group">
            <label>Purchase Amount (₹)</label>
            <input type="number" id="custAmount" placeholder="e.g. 500" min="399" required oninput="updateTierPreview()">
            <div id="tierPreview"></div>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">🎫 Generate Scratch Card</button>
      </form>

      <!-- Generated Link -->
      <div class="link-result" id="linkResult">
        <h3>✅ Scratch Card Created!</h3>
        <div class="link-box">
          <input type="text" id="generatedLink" readonly>
          <button class="copy-btn" onclick="copyLink()">📋 Copy</button>
        </div>
        <a class="whatsapp-btn" id="whatsappLink" href="#" target="_blank">
          💬 Send via WhatsApp
        </a>
      </div>
    </div>

    <!-- Customers Table -->
    <div class="table-card">
      <h2>📋 All Scratch Cards</h2>

      <div class="stats" id="stats">
        <div class="stat-box">
          <div class="number" id="totalCount">0</div>
          <div class="label">Total Cards</div>
        </div>
        <div class="stat-box">
          <div class="number" id="revealedCount">0</div>
          <div class="label">Scratched</div>
        </div>
        <div class="stat-box">
          <div class="number" id="pendingCount">0</div>
          <div class="label">Pending</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Amount</th>
            <th>Tier</th>
            <th>Prize</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="customerTableBody">
        </tbody>
      </table>

      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="icon">🎫</div>
        <p>No scratch cards yet. Create one above!</p>
      </div>
    </div>
  </div>

  <script>
    const API = '';

    // ===== Tier Preview =====
    function updateTierPreview() {
      const amount = parseFloat(document.getElementById('custAmount').value);
      const preview = document.getElementById('tierPreview');

      if (!amount || amount < 399) {
        preview.innerHTML = '<span class="tier-badge tier-none">Minimum ₹399 required</span>';
        return;
      }

      if (amount >= 1000) {
        preview.innerHTML = '<span class="tier-badge tier-gold">🥇 Gold Tier</span>';
      } else if (amount >= 699) {
        preview.innerHTML = '<span class="tier-badge tier-silver">🥈 Silver Tier</span>';
      } else {
        preview.innerHTML = '<span class="tier-badge tier-bronze">🥉 Bronze Tier</span>';
      }
    }

    // ===== Add Customer =====
    async function addCustomer(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const amount = document.getElementById('custAmount').value;
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = '⏳ Creating...';

      try {
        const res = await fetch(`${API}/api/customers`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, amount })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Failed to create scratch card');
          return;
        }

        // Show generated link
        const fullLink = `${window.location.origin}${data.link}`;
        document.getElementById('generatedLink').value = fullLink;
        document.getElementById('linkResult').style.display = 'block';

        // WhatsApp link
        const whatsappMsg = `🎉 Hey ${name}! Thanks for shopping at *The Stationery Hub*! 🎊\n\nYou've earned a *Scratch & Win* card! 🎫✨\n\nScratch here to reveal your FREE gift: ${fullLink}\n\n— The Stationery Hub ❤️`;
        document.getElementById('whatsappLink').href = `https://wa.me/91${phone}?text=${encodeURIComponent(whatsappMsg)}`;

        // Reset form
        document.getElementById('customerForm').reset();
        document.getElementById('tierPreview').innerHTML = '';

        // Reload table
        loadCustomers();
      } catch (err) {
        alert('Network error. Make sure server is running.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = '🎫 Generate Scratch Card';
      }
    }

    // ===== Copy Link =====
    function copyLink() {
      const input = document.getElementById('generatedLink');
      input.select();
      navigator.clipboard.writeText(input.value);

      const btn = event.target;
      btn.textContent = '✅ Copied!';
      setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
    }

    // ===== Load Customers =====
    async function loadCustomers() {
      try {
        const res = await fetch(`${API}/api/admin/customers`);
        const customers = await res.json();

        const tbody = document.getElementById('customerTableBody');
        const emptyState = document.getElementById('emptyState');

        // Update stats
        document.getElementById('totalCount').textContent = customers.length;
        document.getElementById('revealedCount').textContent = customers.filter(c => c.revealed).length;
        document.getElementById('pendingCount').textContent = customers.filter(c => !c.revealed).length;

        if (customers.length === 0) {
          tbody.innerHTML = '';
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';

        tbody.innerHTML = customers.map(c => {
          const tierClass = `tier-${c.tier}`;
          const tierLabel = c.tier === 'gold' ? '🥇 Gold' : c.tier === 'silver' ? '🥈 Silver' : '🥉 Bronze';
          const statusClass = c.revealed ? 'status-revealed' : 'status-pending';
          const statusText = c.revealed ? '✅ Scratched' : '⏳ Pending';
          const prizeDisplay = c.revealed ? `${c.prize_emoji} ${c.prize_text}` : '🔒 Hidden';
          const date = new Date(c.created_at).toLocaleDateString('en-IN', {
            day: 'numeric', month: 'short', year: 'numeric'
          });

          return `
            <tr>
              <td><strong>${escapeHtml(c.name)}</strong></td>
              <td>${escapeHtml(c.phone)}</td>
              <td><strong>₹${c.amount}</strong></td>
              <td><span class="tier-badge ${tierClass}">${tierLabel}</span></td>
              <td>${prizeDisplay}</td>
              <td><span class="status-badge ${statusClass}">${statusText}</span></td>
              <td>${date}</td>
              <td>
                <button class="delete-btn" onclick="deleteCustomer('${c.id}')">🗑️ Delete</button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load customers:', err);
      }
    }

    // ===== Delete Customer =====
    async function deleteCustomer(id) {
      if (!confirm('Are you sure you want to delete this scratch card?')) return;

      try {
        await fetch(`${API}/api/customers/${id}`, { method: 'DELETE' });
        loadCustomers();
      } catch (err) {
        alert('Failed to delete');
      }
    }

    // ===== Helpers =====
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== Init =====
    loadCustomers();
  </script>
</body>
</html>
